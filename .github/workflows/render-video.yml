name: Render faceless video

# Manual single-video render. Pick a script and options, download the MP4 from
# the run's Artifacts. (Auto-render on push is handled by render-on-push.yml.)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Path to the script (any file under content/)"
        required: true
        default: "content/video-01-7-passive-income-ideas-2026.md"
      voice:
        description: "edge-tts voice"
        required: true
        default: "en-IN-NeerjaNeural"
        type: choice
        options:
          - en-IN-NeerjaNeural   # female, Indian English
          - en-IN-PrabhatNeural  # male, Indian English
          - hi-IN-SwaraNeural    # female, fuller Hindi
          - hi-IN-MadhurNeural   # male, fuller Hindi
      rate:
        description: "Speech rate (e.g. +0%, -5%, +10%)"
        required: true
        default: "+0%"
      portrait:
        description: "Vertical 9:16 (Shorts/Reels) instead of 16:9"
        type: boolean
        default: false
      captions:
        description: "Burn in captions"
        type: boolean
        default: true

jobs:
  render:
    uses: ./.github/workflows/render-core.yml
    with:
      script: ${{ inputs.script }}
      voice: ${{ inputs.voice }}
      rate: ${{ inputs.rate }}
      portrait: ${{ inputs.portrait }}
      captions: ${{ inputs.captions }}
    secrets: inherit
